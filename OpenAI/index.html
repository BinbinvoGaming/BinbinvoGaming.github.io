<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .chat-container {
            width: 400px;
            margin: auto;
            border: 1px solid #ccc;
            background: white;
            border-radius: 5px;
            overflow: hidden;
        }
        .messages {
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
        }
        .user {
            background-color: #d1e7dd;
            align-self: flex-end;
        }
        .gpt {
            background-color: #f8d7da;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            padding: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            margin-left: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        const userInput = document.getElementById('userInput');
        const messagesDiv = document.getElementById('messages');
        
        const userMessage = userInput.value;
        if (!userMessage) return;

        // Display user's message
        const userMessageDiv = document.createElement('div');
        userMessageDiv.className = 'message user';
        userMessageDiv.textContent = userMessage;
        messagesDiv.appendChild(userMessageDiv);

        // Clear input
        userInput.value = '';

        // Simulate ChatGPT response (for demo purposes)
        setTimeout(() => {
            const gptMessageDiv = document.createElement('div');
            gptMessageDiv.className = 'message gpt';
            gptMessageDiv.textContent = `ChatGPT: ${generateResponse(userMessage)}`;
            messagesDiv.appendChild(gptMessageDiv);

            // Scroll to the bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 1000);
    }

    function generateResponse(message) {
        // Simple static response logic for demo purposes
        return `You said: "${message}"`;
    }
</script>

</body>
</html>


</html
</html>
